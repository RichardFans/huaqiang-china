name: 下架/移除申请
description: 权利方或创作者本人申请移除条目或更正信息（ADR-0002 承诺 72 小时内处置）
labels: [takedown]
body:
  - type: markdown
    attributes:
      value: |
        本表单面向**视频权利方或 UP 主本人**。本档案仅存元数据与链接；
        如您希望移除条目或更正呈现，我们将按
        [合规姿态](https://github.com/huaqiang-china/huaqiang-china/blob/main/docs/decisions/0002-collection-legal-posture.md)
        在 72 小时内处置。
  - type: input
    id: url
    attributes:
      label: 涉事条目（BV 号或链接）
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: 申请类型
      options:
        - 移除条目
        - 更正信息
        - 其他
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: 身份说明
      description: 证明您与该视频的关系（UP 主名/主页链接/其他凭据）；或在评论中补充
    validations:
      required: true
