name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-gate:
    name: 数据门禁（测试+校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pydantic jsonschema pytest
      - name: pytest
        run: python -m pytest -q
        env:
          PYTHONPATH: tools
      - name: zfq validate（R1-R11）
        run: python -m zfq.validate --json-out tmp/validate.json
        env:
          PYTHONPATH: tools

  site-build:
    name: 站点构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-fund --no-audit
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/
          retention-days: 7

  deploy-pages:
    name: 部署站点（GitHub Pages）
    needs: [data-gate, site-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-smoke:
    name: 部署后冒烟（样式、脚本、关键页面）
    needs: [data-gate, site-build, deploy-pages]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # 2026-11-24 教训：站点曾“在线但整页无样式”，HTML 与 CSS 都是 200。
      # 这里不查渲染，只守住底线：页面引用的每一份样式表/脚本都可达且样式表非空。
      - name: 检查线上页面与资源
        env:
          URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          set -euo pipefail
          code_of() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1"; }
          expect_200() {
            local url="$1" label="$2" code
            for i in 1 2 3 4 5 6; do
              code=$(code_of "$url")
              if [ "$code" = "200" ]; then echo "OK   $label $url"; return 0; fi
              echo "wait $code $url ($i/6)"; sleep 10
            done
            echo "FAIL $label $url -> $code"; return 1
          }
          for path in / /graph/ /chronicle/ /creators/ /scene/maigua/ /en/ /graph.gexf; do
            expect_200 "${URL}${path}" "page"
          done
          html=$(curl -fsSL --max-time 30 "${URL}/")
          refs=$(printf '%s' "$html" | grep -oE '(href|src)="[^"]+\.(css|js)"' \
            | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          test -n "$refs"
          for r in $refs; do
            case "$r" in http*) u="$r" ;; *) u="${URL}${r}" ;; esac
            expect_200 "$u" "asset"
          done
          css=$(printf '%s' "$refs" | grep '\.css$' | head -n 1)
          test -n "$css"
          bytes=$(curl -s --max-time 30 "${URL}${css}" | wc -c)
          echo "stylesheet bytes: $bytes"
          [ "$bytes" -gt 1000 ]
