name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-gate:
    name: 数据门禁（测试+校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pydantic jsonschema pytest
      - name: pytest
        run: python -m pytest -q
        env:
          PYTHONPATH: tools
      - name: zfq validate（R1-R11）
        run: python -m zfq.validate --json-out tmp/validate.json
        env:
          PYTHONPATH: tools

  site-build:
    name: 站点构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-fund --no-audit
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/
          retention-days: 7

  deploy-pages:
    name: 部署站点（GitHub Pages）
    needs: [data-gate, site-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      # deploy-pages 偶发竞态：上传刚成功，紧接着查产物元数据却拿到过期结果
      # （“No artifacts named github-pages”）。首次部署不致命，等 20 秒重试一次。
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 等待产物元数据就绪
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  deploy-smoke:
    name: 部署后冒烟（样式、脚本、关键页面）
    needs: [data-gate, site-build, deploy-pages]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # 2026-11-24 教训：站点曾“在线但整页无样式”，HTML 与 CSS 都是 200。
      # 脚本放在仓库里（site/scripts/smoke.sh），本地能原样运行，与 CI 是同一份代码。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site/scripts
          sparse-checkout-cone-mode: false
      - name: 检查线上页面与资源
        env:
          SITE_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: bash site/scripts/smoke.sh "$SITE_URL"
