[project]
name = "zfq"
version = "0.1.0"
description = "征服二创宇宙档案（The Conquest Remix Archive）数据管线：采集·入册·跟踪·校验·构建"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "tools" }
packages = ["zfq"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tools/tests"]
